[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "far2"
version = "0.1.0"
description = "FAR2-5M: proving the cognition mechanism (adaptive recurrence, dynamic representation, reconsideration, epistemic state, protected goal) at 5M parameters"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["far2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
